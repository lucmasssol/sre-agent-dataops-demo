name: Deploy HTTP Function Demo

on:
  push:
    branches: [main]
    paths:
      - 'src/function_http/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'src/function_http'
  PYTHON_VERSION: '3.11'
  AZURE_FUNCTIONAPP_NAME: 'sre-dataops-demo-func'
  AZURE_RESOURCE_GROUP: 'rg-sre-agent-dataops-demo'
  AZURE_STORAGE_ACCOUNT: 'stsredataopsdemo2jj2mypj'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install dependencies
        run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          pip install -r requirements.txt --target ".python_packages/lib/site-packages"

      - name: Create deployment package
        run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          zip -r ../../function.zip .

      - name: Upload package to blob (AAD auth)
        run: |
          az storage container create \
            --account-name ${{ env.AZURE_STORAGE_ACCOUNT }} \
            --name deployments \
            --auth-mode login
          az storage blob upload \
            --account-name ${{ env.AZURE_STORAGE_ACCOUNT }} \
            --container-name deployments \
            --name function-http-demo.zip \
            --file function.zip \
            --auth-mode login \
            --overwrite

      - name: Point Function App to package URL via managed identity
        run: |
          PACKAGE_URL="https://${{ env.AZURE_STORAGE_ACCOUNT }}.blob.core.windows.net/deployments/function-http-demo.zip"
          az functionapp config appsettings set \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
            --settings WEBSITE_RUN_FROM_PACKAGE=$PACKAGE_URL WEBSITE_RUN_FROM_PACKAGE_BLOB_MI_RESOURCE_ID=SystemAssigned
          az functionapp restart \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_FUNCTIONAPP_NAME }}
